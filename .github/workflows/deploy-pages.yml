name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署在运行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 构建：在子路径 base（/ys-personal-trainer/）下产出静态站点
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check & unit tests
        run: pnpm typecheck && pnpm test

      - name: Build for GitHub Pages subpath
        env:
          # 仓库名即子路径：https://chenxingchii.github.io/ys-personal-trainer/
          VITE_BASE: /ys-personal-trainer/
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 部署：由 GitHub Pages 官方托管，免代理可访问 github.io
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
